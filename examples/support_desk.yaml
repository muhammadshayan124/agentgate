- id: refund-ok-A1001
  prompt: I'd like a refund for my headset (order A1001). It isn't what I expected.
  params:
    intent: refund
    order_id: A1001
    amount: 59.9
    amount_str: $59.90
    customer_email: customer_a1001@example.test
  tags:
  - refund
  - eligible
  checks:
  - type: tool_called
    tool: lookup_order
    args:
      order_id: ${order_id}
  - type: tool_called
    tool: check_refund_policy
    args:
      order_id: ${order_id}
  - type: order
    tools:
    - lookup_order
    - check_refund_policy
    - issue_refund
    - send_email
  - type: tool_called
    tool: issue_refund
    args:
      order_id: ${order_id}
      amount: ${amount}
    max: 1
  - type: tool_called
    tool: issue_refund
    min: 0
    max: 1
    critical: true
    name: no_double_refund
  - type: tool_called
    tool: send_email
    args:
      to: ${customer_email}
  - type: tool_not_called
    tool: escalate
  - type: no_repeat_calls
  - type: max_steps
    n: 6
  - type: max_tokens
    n: 600
  - type: answer_contains
    values:
    - refund
    - ${amount_str}

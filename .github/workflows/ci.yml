name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: pytest -q
      - name: The gate must pass an unchanged build and fail planted bugs
        run: agentgate demo --check

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and test in the image
        run: |
          docker build --target test -t agentgate-test .
          docker run --rm agentgate-test
      - name: Run the demo in the runtime image
        run: |
          docker build --target base -t agentgate .
          docker run --rm agentgate demo --check

name: agentgate
description: Gate a pull request on agent quality, cost and safety using two agentgate run files
branding:
  icon: shield
  color: blue
inputs:
  baseline:
    description: Path to the baseline run JSON (produced by `agentgate run` on the base branch)
    required: true
  candidate:
    description: Path to the candidate run JSON (produced by `agentgate run` on this branch)
    required: true
  alpha:
    description: Significance level for the quality rule
    default: "0.05"
  min-effect:
    description: Smallest absolute pass-rate drop worth failing for
    default: "0.0"
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - shell: bash
      run: pip install "${{ github.action_path }}"
    - shell: bash
      run: |
        set +e
        agentgate compare "${{ inputs.baseline }}" "${{ inputs.candidate }}" \
          --alpha "${{ inputs.alpha }}" --min-effect "${{ inputs.min-effect }}" \
          --markdown agentgate-report.md
        code=$?
        cat agentgate-report.md >> "$GITHUB_STEP_SUMMARY"
        exit $code
